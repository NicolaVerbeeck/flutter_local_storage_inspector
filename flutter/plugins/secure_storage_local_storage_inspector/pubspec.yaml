name: secure_storage_local_storage_inspector
description: Local storage inspector bindings for secure storage based storage
version: 0.9.0
homepage: https://github.com/NicolaVerbeeck/flutter_local_storage_inspector

funding:
  - https://github.com/sponsors/NicolaVerbeeck
  - https://ko-fi.com/nicolaverbeeck

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Specifying any could cause compatibility issues,
  # But allows non-breaking major updates to be installed
  flutter_secure_storage: any
  storage_inspector: ^0.5.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
